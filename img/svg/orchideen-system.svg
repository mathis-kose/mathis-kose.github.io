<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="t d">
<title id="t">Orchideen-Bewässerungssystem</title>
<desc id="d">Flaches Wasser-Reservoir mit Wasserstand, dahinter ein dünner Stab. Ein freischwebendes Stück Korkeichenholz trägt eine Phalaenopsis-Orchidee mit Luftwurzeln, Blättern und überhängendem Blütenstiel. Ein Schlauch führt vom Reservoir zum Holz. Eine LED-Leuchte am Stabende beleuchtet die Orchidee von oben.</desc>
<style>
@supports (--a:0){.k{stroke:var(--ink,#1a1a1a)}
.paper{fill:var(--paper,#fcfdff)}
.inkf{fill:var(--ink,#1a1a1a)}}
.cone{opacity:.25}
.drop,.drop2,.drop3{opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-84px)}}
@keyframes glow{0%,100%{opacity:.18}50%{opacity:.38}}
.is-live .drop{animation:rise 3s linear infinite}
.is-live .drop2{animation:rise 3s linear 1s infinite}
.is-live .drop3{animation:rise 3s linear 2s infinite}
.is-live .cone{animation:glow 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.is-live .drop,.is-live .drop2,.is-live .drop3,.is-live .cone{animation:none}}
</style>
